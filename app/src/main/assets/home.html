<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Search</title>
<style>
  :root {
    --bg:#FAFAFA; --fg:#0E0E10; --muted:#8A8A8F; --line:#E4E4E7;
    --field:#FFFFFF; --accent:#2B6CF0;
    --shadow:0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0E0E10; --fg:#FAFAFA; --muted:#8A8A8F; --line:#26262A;
      --field:#17171A; --accent:#4C8DFF;
      --shadow:0 1px 3px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Roboto","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center; padding:12vh 22px 40px; }
  .wordmark { font-size:34px; font-weight:700; letter-spacing:0.02em; margin:0 0 26px; color:var(--accent); }
  .field { width:100%; max-width:540px; display:flex; align-items:center; gap:12px; background:var(--field);
    border:1px solid var(--line); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow);
    transition:border-color .15s ease; }
  .field:focus-within { border-color:var(--accent); }
  .field svg { width:20px; height:20px; flex:none; }
  .field input { flex:1; border:none; outline:none; background:transparent; color:var(--fg); font-size:16px; font-family:inherit; }
  .field input::placeholder { color:var(--muted); }
  .tiles-card { width:100%; max-width:540px; margin-top:20px; background:var(--field); border:1px solid var(--line);
    border-radius:16px; box-shadow:var(--shadow); padding:14px 8px; display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
  .tiles-card.hidden { display:none; }
  .tile { display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px 4px; border-radius:12px; text-decoration:none; color:var(--fg); }
  .tile:active { background:var(--bg); }
  .tile .fav { width:40px; height:40px; border-radius:11px; background:var(--bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; color:var(--muted); overflow:hidden; }
  .tile .fav img { width:100%; height:100%; object-fit:cover; }
  .tile span { font-size:12px; color:var(--muted); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="wordmark">Search</div>
    <label class="field">
      <input id="q" type="text" inputmode="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Search the web" />
    </label>
    <div class="tiles-card" id="tiles"></div>
  </div>
<script>
  var showTiles = true;
  try {
    if (window.SearchApp && window.SearchApp.getConfig) {
      var cfg = JSON.parse(window.SearchApp.getConfig());
      if (cfg.accent) {
        document.documentElement.style.setProperty('--accent', cfg.accent);

      }
      showTiles = (cfg.tiles !== false);
    }
  } catch (e) {}

  var input = document.getElementById('q');
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var v = input.value.trim();
      if (v && window.SearchApp && window.SearchApp.submit) window.SearchApp.submit(v);
    }
  });
  var host = document.getElementById('tiles');
  if (!showTiles) { host.classList.add('hidden'); }
  else {
    var shortcuts=[{label:'Google',url:'https://www.google.com'},{label:'YouTube',url:'https://m.youtube.com'},{label:'Wikipedia',url:'https://wikipedia.org'},{label:'GitHub',url:'https://github.com'}];
    shortcuts.forEach(function(s){
      var a=document.createElement('a'); a.className='tile'; a.href='javascript:void(0)';
      a.onclick=function(){ if(window.SearchApp&&window.SearchApp.open) window.SearchApp.open(s.url); };
      var fav=document.createElement('div'); fav.className='fav'; fav.textContent=s.label.charAt(0);
      var img=document.createElement('img'); var dom=s.url.replace(/^https?:\/\//,'').split('/')[0];
      img.src='https://www.google.com/s2/favicons?domain='+dom+'&sz=64';
      img.onload=function(){ fav.textContent=''; fav.appendChild(img); };
      var span=document.createElement('span'); span.textContent=s.label;
      a.appendChild(fav); a.appendChild(span); host.appendChild(a);
    });
  }
</script>
</body>
</html>
