<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Search</title>
<style>
  :root {
    --bg:#FAFAFA; --fg:#0E0E10; --muted:#8A8A8F; --line:#E4E4E7;
    --field:#FFFFFF; --accent:#2B6CF0;
    --shadow:0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0E0E10; --fg:#FAFAFA; --muted:#8A8A8F; --line:#26262A;
      --field:#17171A; --accent:#4C8DFF;
      --shadow:0 1px 3px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Roboto","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center;
    padding:4vh 14px 40px; transition:padding-top .15s ease; }

  .wordmark {
    font-size:clamp(44px, 12vw, 58px);
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0 0 18px;
    color:var(--accent);
    text-shadow:0 4px 18px rgba(0,0,0,0.08);
  }

  /* The search pill — no icon, just the input. This is the working
     omnibox for the home page: SearchApp.submit() feeds straight into
     the same go() the native address bar uses everywhere else. */
  .field {
    width:100%; max-width:600px;
    display:flex; align-items:center; gap:10px;
    background:var(--field); border:1px solid var(--line);
    border-radius:30px; padding:16px 18px 16px 24px; box-shadow:var(--shadow);
    transition:border-color .15s ease;
  }
  .field:focus-within { border-color:var(--accent); }
  .field input {
    flex:1; min-width:0; border:none; outline:none; background:transparent;
    color:var(--fg); font-size:17px; font-family:inherit;
  }
  .field input::placeholder { color:var(--muted); }
  .field .ficon {
    width:26px; height:26px; flex:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
  }
  .field .ficon svg { width:22px; height:22px; display:block; }
  .field .fdiv { width:1px; height:22px; background:var(--line); flex:none; }


  /* Shortcut row: floating circular icons, Google-NTP style — no card shell. */
  .shortcuts {
    width:100%; max-width:420px;
    display:grid; grid-template-columns:repeat(4,1fr);
    gap:6px; margin-top:34px;
  }
  .shortcuts.hidden { display:none; }
  .tile {
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:6px 2px; border-radius:16px;
    text-decoration:none; color:var(--fg);
  }
  .tile:active { background:rgba(128,128,128,0.12); }
  .tile .fav {
    width:56px; height:56px; border-radius:50%;
    background:var(--field); box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:600; color:var(--muted);
    overflow:hidden;
  }
  .tile .fav img { width:100%; height:100%; object-fit:cover; }
  .tile span {
    font-size:12px; color:var(--muted); max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* News feed */
  .feed { width:100%; max-width:600px; margin-top:34px; }
  .feed.hidden { display:none; }
  .feed-head {
    font-size:13px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.04em;
    margin:0 4px 12px;
  }
  .feed-card {
    display:flex; gap:12px; align-items:stretch;
    background:var(--field); border:1px solid var(--line);
    border-radius:16px; overflow:hidden; margin-bottom:10px;
    text-decoration:none; color:var(--fg); box-shadow:var(--shadow);
  }
  .feed-card:active { background:rgba(128,128,128,0.10); }
  .feed-card .thumb {
    width:96px; min-width:96px; background:var(--line);
    background-size:cover; background-position:center;
  }
  .feed-card .body { padding:12px 14px 12px 0; flex:1; min-width:0; }
  .feed-card .title {
    font-size:14px; font-weight:600; line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .feed-card .src { font-size:11px; color:var(--muted); margin-top:6px; text-transform:capitalize; }
  .feed-card.no-thumb .body { padding-left:14px; }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="wordmark">Search</div>
    <label class="field" id="field">
      <input id="q" type="text" inputmode="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Search the web" />
      <span class="ficon" id="micBtn" role="button" aria-label="Voice search">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </span>
      <span class="fdiv"></span>
      <span class="ficon" id="scanBtn" role="button" aria-label="Scan code">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M3 12h18"/></svg>
      </span>
    </label>
    <div class="shortcuts" id="tiles"></div>
    <div class="feed hidden" id="feed"></div>
  </div>
<script>
  var showTiles = true;
  try {
    if (window.SearchApp && window.SearchApp.getConfig) {
      var cfg = JSON.parse(window.SearchApp.getConfig());
      if (cfg.accent) document.documentElement.style.setProperty('--accent', cfg.accent);
      showTiles = (cfg.tiles !== false);
    }
  } catch (e) {}

  // ---------- Search box: dumb button that opens the native search page ----------
  var input = document.getElementById('q');
  input.readOnly = true;  // no typing here; the native omnibox handles input
  function openNativeSearch() {
    if (window.SearchApp && window.SearchApp.focusSearch) window.SearchApp.focusSearch();
  }
  input.addEventListener('focus', function () { input.blur(); openNativeSearch(); });
  input.addEventListener('click', openNativeSearch);

  var micBtn = document.getElementById('micBtn');
  var scanBtn = document.getElementById('scanBtn');
  if (micBtn) micBtn.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    if (window.SearchApp && window.SearchApp.startVoice) window.SearchApp.startVoice();
  });
  if (scanBtn) scanBtn.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    if (window.SearchApp && window.SearchApp.startScan) window.SearchApp.startScan();
  });

  // ---------- Shortcut tiles ----------
  var host = document.getElementById('tiles');

  function labelFromDomain(d){
    var name = d.split('.')[0];
    return name.charAt(0).toUpperCase() + name.slice(1);
  }

  function buildTile(label, url){
    var a=document.createElement('a'); a.className='tile'; a.href='javascript:void(0)';
    a.onclick=function(){ if(window.SearchApp&&window.SearchApp.open) window.SearchApp.open(url); };
    var fav=document.createElement('div'); fav.className='fav';
    fav.textContent=label.charAt(0).toUpperCase();
    var span=document.createElement('span'); span.textContent=label;
    a.appendChild(fav); a.appendChild(span); host.appendChild(a);
    var dom=url.replace(/^https?:\/\//,'').split('/')[0].replace(/^www\./,'');
    var img=document.createElement('img');
    img.src='https://www.google.com/s2/favicons?domain='+dom+'&sz=128';
    img.onload=function(){ fav.textContent=''; fav.appendChild(img); };
    img.onerror=function(){ /* keep the grey letter */ };
  }

  var DEFAULTS=[{label:'Google',url:'https://www.google.com'},{label:'Claude',url:'https://claude.ai'},{label:'Wikipedia',url:'https://wikipedia.org'},{label:'GitHub',url:'https://github.com'}];

  function renderTiles(){
    host.innerHTML='';
    if (!showTiles){ host.classList.add('hidden'); return; }
    host.classList.remove('hidden');

    var recent=[];
    try {
      if (window.SearchApp && window.SearchApp.getRecentSites) {
        recent = JSON.parse(window.SearchApp.getRecentSites());
      }
    } catch(e){ recent=[]; }

    // Recent sites (newest first) push in from the left; defaults fill the rest.
    // Always show exactly 4, defaults falling off the right as recent grows.
    var combined = [];
    recent.forEach(function(r){ combined.push({label:labelFromDomain(r.domain), url:r.url}); });
    DEFAULTS.forEach(function(d){
      // avoid duplicating a default that's already in recent
      var dom = d.url.replace(/^https?:\/\//,'').split('/')[0].replace(/^www\./,'');
      var dup = combined.some(function(c){
        return c.url.replace(/^https?:\/\//,'').split('/')[0].replace(/^www\./,'') === dom;
      });
      if (!dup) combined.push(d);
    });
    combined.slice(0,4).forEach(function(t){ buildTile(t.label, t.url); });
  }

  renderTiles();
  // Re-render tiles when the page becomes visible again (instant, no manual reload).
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') renderTiles();
  });
  window.addEventListener('pageshow', renderTiles);
  window.addEventListener('focus', renderTiles);

  // ---------- News feed ----------
  var feedHost = document.getElementById('feed');
  var feedReqId = 0;
  var feedLoaded = false;

  function renderFeed(items){
    feedHost.innerHTML='';
    if (!items || !items.length){ feedHost.classList.add('hidden'); return; }
    var head=document.createElement('div'); head.className='feed-head';
    head.textContent='Top stories';
    feedHost.appendChild(head);
    items.slice(0,12).forEach(function(it){
      var a=document.createElement('a'); a.className='feed-card'; a.href='javascript:void(0)';
      a.onclick=function(){ if(window.SearchApp&&window.SearchApp.open) window.SearchApp.open(it.link); };
      if (it.image){
        var t=document.createElement('div'); t.className='thumb';
        t.style.backgroundImage="url('"+it.image.replace(/'/g,"%27")+"')";
        a.appendChild(t);
      } else {
        a.classList.add('no-thumb');
      }
      var b=document.createElement('div'); b.className='body';
      var ti=document.createElement('div'); ti.className='title'; ti.textContent=it.title;
      b.appendChild(ti);
      if (it.source){ var sc=document.createElement('div'); sc.className='src'; sc.textContent=it.source; b.appendChild(sc); }
      a.appendChild(b);
      feedHost.appendChild(a);
    });
    feedHost.classList.remove('hidden');
  }

  window.__onFeed = function(reqId, items){
    if (reqId !== feedReqId) return;
    feedLoaded = true;
    renderFeed(items);
  };

  function loadFeed(){
    if (!window.SearchApp || !window.SearchApp.getFeed) return;
    feedReqId++;
    try { window.SearchApp.getFeed(feedReqId); } catch(e){}
  }

  loadFeed();
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && !feedLoaded) loadFeed();
  });
</script>
</body>
</html>
