<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background: transparent; }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:-apple-system,"Roboto",system-ui,sans-serif;
  }
  .stage { display:flex; flex-direction:column; align-items:center; }
  .owl {
    width: 160px; height: 160px; will-change: transform;
    transform: translate3d(0,130vh,0);
    animation: flyIn 1.25s cubic-bezier(.16,.84,.30,1) forwards;
  }
  @keyframes flyIn {
    0%   { transform: translate3d(0,130vh,0) scale(.92); }
    60%  { transform: translate3d(0,-18px,0) scale(1.05); }
    78%  { transform: translate3d(0,8px,0)  scale(.98); }
    90%  { transform: translate3d(0,-4px,0) scale(1.01); }
    100% { transform: translate3d(0,0,0)    scale(1); }
  }
  .word {
    margin-top: 26px; color:#FAFAFA; font-size:27px; font-weight:700;
    letter-spacing:.14em; opacity:0; will-change: opacity, transform;
    animation: fadeUp 0.6s ease forwards 0.9s;
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translate3d(0,10px,0); }
    to   { opacity:1; transform: translate3d(0,0,0); }
  }
</style>
</head>
<body>
  <div class="stage">
    <svg class="owl" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8B6BD8"/><stop offset="1" stop-color="#5E44A0"/></linearGradient></defs>
      <path d="M 256 130 C 340 130, 385 195, 385 280 C 385 355, 330 400, 256 400 C 182 400, 127 355, 127 280 C 127 195, 172 130, 256 130 Z" fill="url(#b)"/>
      <path d="M 175 155 L 150 100 L 205 140 Z" fill="#5E44A0"/>
      <path d="M 337 155 L 362 100 L 307 140 Z" fill="#5E44A0"/>
      <path d="M 256 220 C 300 220, 320 260, 320 300 C 320 345, 290 375 256 375 C 222 375, 192 345, 192 300 C 192 260, 212 220, 256 220 Z" fill="#B9A3E8" opacity="0.55"/>
      <circle cx="212" cy="235" r="52" fill="#FAFAFA"/>
      <circle cx="300" cy="235" r="52" fill="#FAFAFA"/>
      <circle cx="212" cy="238" r="28" fill="#F5A623"/>
      <circle cx="300" cy="238" r="28" fill="#F5A623"/>
      <circle cx="212" cy="240" r="15" fill="#141024"/>
      <circle cx="300" cy="240" r="15" fill="#141024"/>
      <circle cx="219" cy="233" r="5" fill="#FFFFFF"/>
      <circle cx="307" cy="233" r="5" fill="#FFFFFF"/>
      <path d="M 256 260 L 238 300 L 256 312 L 274 300 Z" fill="#F5A623"/>
    </svg>
    <div class="word">Search</div>
  </div>
</body>
</html>
